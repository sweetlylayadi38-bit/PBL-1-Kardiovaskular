<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arteri kepala dan leher</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f4ef; --ink: #2a2521; --muted: #7b7067; --line: #e7e0d6; --art: #d63a2c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12100e; --ink: #efe8df; --muted: #a2978a; --line: #2d2924; --art: #ff5a48; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.page { max-width: 1180px; margin: 0 auto; padding: 32px 20px 48px; }
.eyebrow { margin: 0; font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); letter-spacing: .04em; }
h1 { margin: 4px 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.lede { margin: 6px 2px 18px; color: var(--muted); max-width: 100ch; }
.lede > p { margin: 0; }
.lede h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--ink); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lede h2 .num { font-size: 11px; }
.lede h2 .flow { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); font-weight: 400; }
.lede dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 14px; margin: 0; font-size: 14px; line-height: 1.45; }
.lede dt { color: var(--muted); font-size: 12px; padding-top: 2px; text-transform: uppercase; letter-spacing: .05em; }
.lede dd { margin: 0; color: var(--ink); }
.lede dd.klinis { color: var(--muted); }
.lede dd.ingat { color: var(--ink); font-style: italic; }
.lede dt.ingat { color: var(--art); }
.lede > p { color: var(--ink); line-height: 1.6; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; outline: none; }
.figs:focus-visible { outline: 1px solid var(--muted); outline-offset: 6px; border-radius: 14px; }
/* the drawings are on white paper, in both themes */
.fig { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px; }
.fig figcaption { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #7b7067; }
.tag { font: 11px ui-monospace, Menlo, monospace; color: #2a2521; border: 1px solid #e7e0d6; border-radius: 6px; padding: 0 6px; }
.stage { position: relative; margin-top: 6px; aspect-ratio: 765 / 1024; touch-action: pan-y; }
.stage > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.veil { background: #fff; opacity: 0; transition: opacity .3s; pointer-events: none; }
.fig[data-focus] .veil { opacity: .68; }
/* taken apart: the drawing without its arteries underneath, every artery on its own sheet */
canvas.bare { opacity: 0; }
.stage[data-apart] canvas.bare { opacity: 1; }
.stage[data-apart] canvas.layer { opacity: 1; filter: drop-shadow(0 calc(var(--e, 0) * 9px) calc(var(--e, 0) * 7px) rgba(70, 25, 15, .28)); transition: none; }
.fig[data-focus] .stage[data-apart] canvas.layer:not([data-on]) { opacity: .28; }
.stage[data-apart] canvas.layer[data-on] { filter: drop-shadow(0 0 3px rgba(214,58,44,.95)) drop-shadow(0 calc(var(--e, 0) * 9px) calc(var(--e, 0) * 7px) rgba(70, 25, 15, .3)); }
.lbl-s { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #4a403a; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.lbl-s-line { stroke: #8a7d73; stroke-width: 1; fill: none; }
.tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.tools button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--art) 9%, transparent); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--art) 40%, var(--line)); }
.tools button:hover, .tools button:focus-visible { background: color-mix(in srgb, var(--art) 16%, transparent); outline: none; }
.tools label { display: inline-flex; align-items: center; gap: 8px; }
.tools input[type=range] { width: 160px; accent-color: var(--art); }
canvas { pointer-events: none; }
canvas.layer { opacity: 0; transition: opacity .3s; }
canvas.layer[data-on] { opacity: 1; filter: drop-shadow(0 0 2.5px rgba(214, 58, 44, .9)) drop-shadow(0 0 7px rgba(214, 58, 44, .45)); animation: thump .8333s ease-out infinite; }
@keyframes thump { 0% { filter: brightness(1.25) drop-shadow(0 0 3px rgba(214,58,44,.95)) drop-shadow(0 0 10px rgba(214,58,44,.6)); } 35%, 100% { filter: brightness(1) drop-shadow(0 0 2.5px rgba(214,58,44,.9)) drop-shadow(0 0 6px rgba(214,58,44,.4)); } }
canvas.beat { display: none; }
/* blood flow: a soft glint runs from each artery's origin to its end, clipped to the red ink */
.flow { pointer-events: none; mix-blend-mode: screen; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.flow polyline { fill: none; stroke: #ffc2b4; stroke-width: 18; stroke-linecap: round; stroke-dasharray: .2 1.3; stroke-dashoffset: .2; filter: blur(2.5px); animation: flow 2.4s linear infinite; }
@keyframes flow { from { stroke-dashoffset: .2; } 55%, to { stroke-dashoffset: -1.1; } }
.stage[data-apart] .flow, .fig[data-focus] .flow polyline:not([data-on]) { display: none; }
svg .hit { fill: none; stroke: transparent; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; cursor: pointer; }
.lbl { font: 600 19px ui-sans-serif, system-ui, sans-serif; fill: #2a2521; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.lbl-line { stroke: #2a2521; stroke-width: 1.3; fill: none; }
.lbl-dot { fill: #2a2521; }
.bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 14px 2px 2px; font-size: 13px; }
.readout { font: 13px ui-monospace, Menlo, monospace; }
.hint { color: var(--muted); }

.parts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.part { display: inline-flex; gap: 7px; align-items: baseline; padding: 5px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.part:hover, .part:focus-visible, .part[data-on] { color: var(--ink); background: color-mix(in srgb, var(--art) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--art) 45%, var(--line)); outline: none; }
.part .where { font-size: 11px; color: var(--muted); }
.num { font: 10px ui-monospace, Menlo, monospace; color: var(--muted); }
.cap { color: var(--muted); max-width: 78ch; margin: 0; }
.cap b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .flow { display: none; }
  canvas.layer[data-on] { animation: none; }
  .veil, canvas.layer { transition: none; }
}
@media (max-width: 760px) {
  .page { padding: 20px 16px 40px; }
  h1 { font-size: 22px; }
  .figs { grid-template-columns: 1fr; }
  .lede dl { grid-template-columns: 1fr; gap: 0; }
  .lede dt { padding-top: 6px; }
  .lbl { font-size: 30px; stroke-width: 7px; }
  .lbl-s { font-size: 24px; stroke-width: 6px; }
}
</style>
</head>

function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));

  const stage = fig.querySelector(".stage");
  const svg = fig.querySelector("svg");
  const hits = svg.querySelector(".hits");
  const lines = LINES[key];
  fig.layers = {};

  fig.hitGroups = {};
  fig.off = {};
  for (const id in lines) {
    const g = el("g", {}, hits);
    fig.hitGroups[id] = g;
    fig.off[id] = [0, 0];
    for (const line of lines[id]) {
      const hit = el("polyline", { class: "hit", points: pts(line), "stroke-width": 26 }, g);
      hit.dataset.v = id;
    }
  }

  const go = () => {
    const src = document.createElement("canvas");
    src.width = W; src.height = H;
    const sx = src.getContext("2d", { willReadFrequently: true });
    sx.drawImage(img, 0, 0, W, H);
    const data = sx.getImageData(0, 0, W, H).data;
    const segs = [];
    for (const id in lines) for (const line of lines[id]) for (let i = 1; i < line.length; i++) segs.push([id, ...line[i - 1], ...line[i]]);
    const ids = Object.keys(lines);
    const out = Object.fromEntries(ids.map((id) => [id, new ImageData(W, H)]));
    const beat = new ImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4;
      const r = data[o], g = data[o + 1], b = data[o + 2];
      // red ink: arteries and their dark outlines; bone, brain and skin are not this saturated
      const red = r > 105 && r - g > 62 && r - b > 55;
      if (!red) continue;
      let best = Infinity, who = null;
      for (const s of segs) {
        const d = segDist2(x, y, s[1], s[2], s[3], s[4]);
        if (d < best) { best = d; who = s[0]; }
      }
      if (best > 90 * 90) continue;
      const strength = Math.min(1, (r - g - 40) / 80);
      const t = out[who].data;
      t[o] = r; t[o + 1] = g; t[o + 2] = b; t[o + 3] = 255 * Math.max(0.35, strength);
      beat.data[o] = 255; beat.data[o + 1] = 150; beat.data[o + 2] = 130; beat.data[o + 3] = 255 * strength;
    }
    for (const id of ids) {
      const c = document.createElement("canvas");
      c.width = W; c.height = H; c.className = "layer";
      c.getContext("2d").putImageData(out[id], 0, 0);
      stage.insertBefore(c, svg);
      fig.layers[id] = c;
    }
    const bc = fig.querySelector("canvas.beat");
    bc.width = W; bc.height = H;
    bc.getContext("2d").putImageData(beat, 0, 0);
    const flow = fig.querySelector(".flow");
    flow.style.webkitMaskImage = flow.style.maskImage = `url(${bc.toDataURL()})`;
    for (const id in lines) lines[id].forEach((line, i) => {
      const run = FLIP.has(`${key}.${id}.${i}`) ? line.toReversed() : line;
      const pl = el("polyline", { points: pts(run), pathLength: 1 }, flow);
      pl.dataset.v = id;
      // branches light up after the trunk that feeds them
      pl.style.animationDelay = `${(DEPTH[key][id] ?? 1) * 0.35 + i * 0.12}s`;
    });
    fig.flow = [...flow.children];

    // where each artery goes when the figure comes apart: the whole tree lifts off the
    // bones (LIFT), and each artery moves away from the panel's hub along its own centroid
    const { hub, lift, spread } = APART[key];
    for (const id of ids) {
      const d = out[id].data;
      let sx2 = 0, sy2 = 0, n = 0;
      for (let i = 3; i < d.length; i += 16) if (d[i]) { const p = (i - 3) / 4; sx2 += p % W; sy2 += Math.floor(p / W); n++; }
      if (!n) continue;
      const cx = sx2 / n - hub[0], cy = sy2 / n - hub[1];
      const len = Math.hypot(cx, cy) || 1;
      const k = spread * Math.min(1, len / 140);
      fig.off[id] = [lift[0] + (cx / len) * k, lift[1] + (cy / len) * k];
    }

    // the drawing with its arteries lifted out: fill the red from the surrounding paper,
    // and leave the bed a shade darker so it reads as the groove the artery lay in
    const mask = new Uint8Array(W * H);
    for (let p = 0; p < W * H; p++) {
      const r = data[p * 4], g = data[p * 4 + 1], b = data[p * 4 + 2];
      if (key === "lat" ? r > 90 && r - g > 30 && r - b > 26 : r > 100 && r - g > 55 && r - b > 48) mask[p] = 1;
    }
    for (let pass = 0; pass < 2; pass++) {
      const grow = mask.slice();
      for (let p = W; p < W * H - W; p++) if (!mask[p] && (mask[p - 1] || mask[p + 1] || mask[p - W] || mask[p + W])) grow[p] = 1;
      mask.set(grow);
    }
    const px = new Uint8ClampedArray(data);
    const bed = mask.slice();
    let todo = [];
    for (let p = 0; p < W * H; p++) if (mask[p]) todo.push(p);
    for (let iter = 0; iter < 80 && todo.length; iter++) {
      const next = [], fills = [];
      for (const p of todo) {
        let r = 0, g = 0, b = 0, n = 0;
        for (const q of [p - 1, p + 1, p - W, p + W, p - W - 1, p - W + 1, p + W - 1, p + W + 1]) {
          if (q < 0 || q >= W * H || mask[q]) continue;
          r += px[q * 4]; g += px[q * 4 + 1]; b += px[q * 4 + 2]; n++;
        }
        if (n) fills.push(p, r / n, g / n, b / n); else next.push(p);
      }
      for (let i = 0; i < fills.length; i += 4) {
        const p = fills[i];
        px[p * 4] = fills[i + 1]; px[p * 4 + 1] = fills[i + 2]; px[p * 4 + 2] = fills[i + 3];
        mask[p] = 0;
      }
      todo = next;
    }
    for (let p = 0; p < W * H; p++) if (bed[p]) { px[p * 4] *= 0.93; px[p * 4 + 1] *= 0.91; px[p * 4 + 2] *= 0.89; }
    const bare = document.createElement("canvas");
    bare.width = W; bare.height = H; bare.className = "bare";
    bare.getContext("2d").putImageData(new ImageData(px, W, H), 0, 0);
    stage.insertBefore(bare, img.nextSibling);
    fig.ready = true;
    apply();
    if (selected) select(selected, true);
  };
  if (img.complete && img.naturalWidth) go(); else img.addEventListener("load", go, { once: true });
}

function label(fig, id) {
  const layer = fig.querySelector(".lbls");
  layer.replaceChildren();
  if (id) return tag(fig, layer, id, false);
  // taken apart and nothing picked: every artery carries its name
  if (E > 0.6) for (const k in LINES[fig.dataset.fig]) tag(fig, layer, k, true);
}
function tag(fig, layer, id, small) {
  const lines = LINES[fig.dataset.fig][id];
  if (!lines) return;
  const line = lines[0];
  const [at, side, dy = -34] = (fig.dataset.fig === "inf" && LABEL_INF[id]) || LABEL_AT[id];
  // walk the first centreline to the label point
  let total = 0; const lens = [];
  for (let i = 1; i < line.length; i++) { const l = Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]); lens.push(l); total += l; }
  let want = total * at, x = line[0][0], y = line[0][1];
  for (let i = 0; i < lens.length; i++) {
    if (want <= lens[i]) { const t = want / lens[i]; x = line[i][0] + t * (line[i + 1][0] - line[i][0]); y = line[i][1] + t * (line[i + 1][1] - line[i][1]); break; }
    want -= lens[i]; x = line[i + 1][0]; y = line[i + 1][1];
  }
  const o = fig.off[id] || [0, 0];
  x += o[0] * E; y += o[1] * E;
  const reach = small ? 34 : 80;
  const tx = Math.max(16, Math.min(W - 16, x + side * reach));
  const ty = y + (small ? Math.sign(dy) * 16 : dy);
  if (!small) el("circle", { class: "lbl-dot", cx: x, cy: y, r: 3.5 }, layer);
  el("path", { class: small ? "lbl-s-line" : "lbl-line", d: `M ${x} ${y} L ${tx} ${ty}` }, layer);
  const t = el("text", { class: small ? "lbl-s" : "lbl", x: tx + side * 4, y: ty - 4, "text-anchor": side > 0 ? "start" : "end" }, layer);
  t.textContent = SHORT[id];
  // keep the label inside the drawing
  const box = t.getBBox();
  if (box.x < 6) t.setAttribute("x", tx + 4), t.setAttribute("text-anchor", "start");
  if (box.x + box.width > W - 6) t.setAttribute("x", tx - 4), t.setAttribute("text-anchor", "end");
}

const readout = document.querySelector("[data-readout]");
const lede = document.querySelector("[data-lede]");
const parts = document.querySelector(".parts");
const stageAll = document.querySelector(".figs");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const buttons = ORDER.map((id, i) => {
  const b = document.createElement("button");
  b.className = "part"; b.type = "button"; b.dataset.part = id;
  const where = [LINES.lat[id] && "A", LINES.inf[id] && "B"].filter(Boolean).join(" ");
  b.innerHTML = `<span class="num">${String(i + 1).padStart(2, "0")}</span>${byId[id].name} <span class="where">${where}</span>`;
  parts.appendChild(b);
  return b;
});
const REST = `${BPM} denyut/menit · otak ≈ ${BRAIN} mL/menit`;
let selected = null;
function select(id, force) {
  if (id === selected && !force) return;
  selected = id;
  for (const f of figs) {
    f.toggleAttribute("data-focus", !!id && !!LINES[f.dataset.fig][id]);
    for (const k in f.layers) f.layers[k].toggleAttribute("data-on", k === id);
    for (const pl of f.flow || []) pl.toggleAttribute("data-on", pl.dataset.v === id);
    label(f, id);
  }
  for (const b of buttons) b.toggleAttribute("data-on", b.dataset.part === id);
  if (!id) { readout.textContent = REST; showIntro(); return; }
  const v = byId[id];
  readout.textContent = v.name + (v.flow ? ` · ≈ ${v.flow} mL/menit` : "");
  showDetail(id);
}

// no auto tour: a pick stays until the pointer leaves, then the figure returns to rest
// a click pins an artery: it stays lit until another is clicked, or the same one again, or Escape
let idle = 0, pinned = null;
function hold(id) { clearTimeout(idle); select(id); }
function release() { clearTimeout(idle); idle = setTimeout(() => select(pinned), 1200); }
function pin(id) { pinned = pinned === id ? null : id; hold(pinned); }
for (const f of figs) {
  prepare(f);
  f.addEventListener("pointerover", (e) => { const h = e.target.closest(".hit"); if (h) hold(h.dataset.v); });
  f.addEventListener("click", (e) => { const h = e.target.closest(".hit"); if (h) pin(h.dataset.v); });
  f.addEventListener("pointerout", (e) => { if (e.target.closest(".hit") && !e.relatedTarget?.closest?.(".hit")) release(); });
}
for (const b of buttons) {
  b.addEventListener("pointerenter", () => hold(b.dataset.part));
  b.addEventListener("focus", () => hold(b.dataset.part));
  b.addEventListener("click", () => pin(b.dataset.part));
  b.addEventListener("pointerleave", release);
  b.addEventListener("blur", release);
}
stageAll.addEventListener("keydown", (e) => {
  const here = Math.max(0, ORDER.indexOf(selected));
  let to = null;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") to = selected ? (here + 1) % ORDER.length : 0;
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") to = selected ? (here - 1 + ORDER.length) % ORDER.length : ORDER.length - 1;
  if (e.key === "Home") to = 0;
  if (e.key === "End") to = ORDER.length - 1;
  if (e.key === "Escape") { pinned = null; select(null); return; }
  if (e.key === "b" || e.key === "B") { apartTo(target > 0.5 ? 0 : 1); return; }
  if (to === null) return;
  e.preventDefault();
  pinned = ORDER[to]; hold(pinned);
});
stageAll.addEventListener("blur", release);
// the explanation box keeps the height of its longest text, so the figures never jump
function fitLede() {
  lede.style.minHeight = "0";
  let m = 0;
  for (const id of ORDER) { showDetail(id); m = Math.max(m, lede.offsetHeight); }
  showIntro(); m = Math.max(m, lede.offsetHeight);
  lede.style.minHeight = m + "px";
  if (selected) showDetail(selected);
}
let fitTimer = 0;
addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitLede, 150); });
fitLede();
select(null);
document.querySelector("[data-apart-btn]").addEventListener("click", () => apartTo(target > 0.5 ? 0 : 1));
document.querySelector("[data-apart-range]").addEventListener("input", (e) => {
  cancelAnimationFrame(apartFrame); apartFrame = 0;
  E = target = e.target.value / 100;
  const btn = document.querySelector("[data-apart-btn]");
  btn.textContent = E > 0.5 ? "Pasang kembali" : "Bongkar";
  btn.setAttribute("aria-pressed", String(E > 0.5));
  apply();
});
if (location.hash === "#bongkar") { E = target = 1; sync(); apply(); }
document.body.classList.add("ready");
</script>
</body>
</html>
