<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arteri Ekstremitas Atas</title>
<style>
:root{
  --page:#f4f1ec;--card:#fffdf9;--ink:#26231f;--text:#57524b;--muted:#8d867c;--rule:#ddd6cb;
  --skin:#fbf5ee;--skin-edge:#cdbfae;--bone:#efe7d6;--bone-edge:#b5a78f;--bone-shade:#e2d7c1;
  --art:#d03c27;--art-edge:#8a2214;--art-shine:#f39a82;--pulse:#fff2d6;--lead:#3a352f;
  --sel:#ff5a3c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d0c0b;--card:#151412;--ink:#ece7df;--text:#b3aca2;--muted:#7a746b;--rule:#2c2925;
  --skin:#1c1a17;--skin-edge:#4a443c;--bone:#3a362e;--bone-edge:#625a4b;--bone-shade:#322e27;
  --art:#e04a33;--art-edge:#6e1a0f;--art-shine:#ff9c84;--pulse:#fff4dc;--lead:#cfc8bd;--sel:#ff6a4d;
}}
:root[data-theme="dark"]{
  --page:#0d0c0b;--card:#151412;--ink:#ece7df;--text:#b3aca2;--muted:#7a746b;--rule:#2c2925;
  --skin:#1c1a17;--skin-edge:#4a443c;--bone:#3a362e;--bone-edge:#625a4b;--bone-shade:#322e27;
  --art:#e04a33;--art-edge:#6e1a0f;--art-shine:#ff9c84;--pulse:#fff4dc;--lead:#cfc8bd;--sel:#ff6a4d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(1120px,100% - 32px);margin:40px auto 80px}
.card{background:var(--card);box-shadow:0 0 0 1px var(--rule);position:relative;padding:44px 20px 40px}
.corner{position:absolute;font:11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;color:var(--muted)}
.corner.tl{top:18px;left:20px}.corner.tr{top:18px;right:20px;text-transform:uppercase}
.corner.bl{bottom:16px;left:20px;text-transform:uppercase}.corner.br{bottom:16px;right:20px;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
@media (max-width:600px){.corner.tr,.corner.bl{display:none}.card{padding:40px 8px 44px}}
.panel{position:sticky;top:16px;padding:18px 18px 16px;box-shadow:0 0 0 1px var(--rule);background:var(--page)}
.panel h2{margin:0;font-size:20px;color:var(--ink);line-height:1.25}
.panel .en{font-size:13px;color:var(--muted);margin:2px 0 10px}
.panel .meta{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:8px}
.panel p{margin:6px 0}
.panel b{color:var(--ink);font-weight:600}
.panel .tip{background:var(--card);padding:8px 10px;margin-top:10px;font-size:14px}
.panel .clin{border-left:2px solid var(--sel);padding-left:10px;margin-top:10px}
.nav{display:flex;gap:6px;margin-top:12px}
.nav button{flex:1;font:inherit;font-size:13px;padding:6px 8px;background:var(--card);color:var(--ink);border:1px solid var(--rule);cursor:pointer}
.nav button:hover{border-color:var(--sel)}
h3{color:var(--ink);font-size:16px;margin:36px 0 6px}
.flow{font:13px/1.8 ui-monospace,Menlo,monospace;color:var(--text);margin:0}
.note{font-size:13px;color:var(--muted);margin-top:18px}

.photo{transition:background .6s,box-shadow .6s;position:relative;background:#fff;box-shadow:0 0 0 1px var(--rule);max-width:620px;margin:0 auto;width:100%}
.photo canvas{display:block;width:100%;height:auto}
.stack{position:relative;aspect-ratio:756/1024}
.layer{position:absolute;left:0;top:0;width:100%;transform-origin:50% 0;transition:transform .8s cubic-bezier(.2,.7,.2,1),box-shadow .8s}
.tag{pointer-events:none;position:absolute;left:0;right:0;top:calc(100% + 18px);text-align:center;font:600 38px/1.2 ui-monospace,Menlo,monospace;color:var(--ink);opacity:0;transition:opacity .5s}
.photo svg{transition:opacity .4s}
.photo.apart{background:transparent;box-shadow:none}
.photo.apart .stack{aspect-ratio:756/400}
.photo.apart .layer{background:#fff;box-shadow:0 0 0 3px #c9c2b6}
.photo.apart .layer[data-k=garis]{transform:translateX(-34%) scale(.32)}
.photo.apart .layer[data-k=tulang]{transform:scale(.32)}
.photo.apart .layer[data-k=arteri]{transform:translateX(34%) scale(.32)}
.photo.apart .tag{opacity:1}
.photo.apart svg{opacity:0;pointer-events:none}
.tools{display:flex;justify-content:center;margin-top:12px}
.tools button{font:inherit;font-size:14px;padding:7px 16px;background:var(--card);color:var(--ink);border:1px solid var(--sel);cursor:pointer}
@media (prefers-reduced-motion:reduce){.stack,.layer,.tag,.photo,.photo svg{transition:none}}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.hot{cursor:pointer}
.hot .box{fill:transparent;stroke:transparent;stroke-width:2;rx:6}
.hot:hover .box{fill:rgba(208,60,39,.06)}
.hot[data-on] .box{fill:rgba(208,60,39,.12);stroke:#d03c27}
.hot .pin{fill:transparent}
.hot[data-on] .ring{stroke:#d03c27;stroke-width:2.5;fill:rgba(208,60,39,.15)}
.ring{fill:none;stroke:transparent}
.hot:focus{outline:none}
.hot:focus-visible .box{stroke:#d03c27;stroke-dasharray:4 3}
.credit{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="corner tl">Gambar 9</span>
    <span class="corner tr">Arteri ekstremitas atas</span>
    <span class="corner bl">Ketuk label · ← →</span>
    <span class="corner br" id="readout">nadi 72/mnt</span>
    <div class="layout">
      <div>
        <div class="photo">
          <div class="stack" role="img" aria-label="Lengan kanan tampak depan dengan tulang dan arteri berlabel: right subclavian, axillary, humeral circumflex, deep brachial, brachial, ulnar collateral, radial, anterior interosseous, ulnar, deep palmar arch, superficial palmar arch, digital.">
            <div class="layer" data-k="garis"><canvas width="756" height="1024"></canvas><span class="tag">Lapisan 1 · Kulit, garis &amp; label</span></div>
            <div class="layer" data-k="tulang"><canvas width="756" height="1024"></canvas><span class="tag">Lapisan 2 · Tulang</span></div>
            <div class="layer" data-k="arteri"><canvas width="756" height="1024"></canvas><span class="tag">Lapisan 3 · Arteri</span></div>
          </div>
          <svg id="fig" viewBox="0 0 756 1024" aria-hidden="false"></svg>
        </div>
        <div class="tools"><button id="explode" type="button" aria-pressed="false">Bongkar lapisan</button></div>
        <p class="credit">Gambar sumber dari Anda. Ketuk nama atau titik pada arteri untuk penjelasan.</p>
      </div>
      <aside class="panel" id="panel" aria-live="polite">
        <h2 id="p-name"></h2>
        <div class="en" id="p-en"></div>
        <div class="meta" id="p-meta"></div>
        <p id="p-from"></p>
        <p id="p-to"></p>
        <p id="p-br"></p>
        <p class="clin" id="p-clin"></p>
        <p class="tip" id="p-tip"></p>
        <div class="nav"><button id="prev" type="button">← Sebelumnya</button><button id="next" type="button">Berikutnya →</button></div>
      </aside>
    </div>
  </div>


</main>
